[project]
name = "ez-voice"
version = "0.1.2"
description = "Local speech-to-text and text-to-speech skills for Claude Code"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "huggingface-hub>=2.4.0",
    "onnx-asr>=0.12.0",
    "onnxruntime>=1.31.1",
    "pocket-tts>=4.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[tool.uv]
exclude-newer = false

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "prek>=0.5.9",
    "pytest",
    "pytest-asyncio>=1.4.1",
    "pytest-cov",
    "ty>=0.0.95",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "e2e: end-to-end tests that download and run real models",
    "e2e_slow: exhaustive e2e matrix (all voices/models); skipped in CI",
]

[tool.coverage.run]
source = ["skills/ez-stt/scripts", "skills/ez-tts/scripts"]

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
src_paths = "tests"
line_length = 80
include_trailing_comma = true
multi_line_output = 3

[tool.ruff]
exclude = ["__pycache__", "terraform", ".git", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
