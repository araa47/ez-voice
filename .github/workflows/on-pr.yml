---
name: On PR

on:
    pull_request:
        branches: [main]
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

jobs:
    prek:
        uses: ./.github/workflows/job-prek.yml

    test:
        uses: ./.github/workflows/job-test.yml
        permissions:
            contents: read
            id-token: write

    e2e:
        uses: ./.github/workflows/job-e2e.yml
        secrets:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}

    test-report:
        needs: [test, e2e]
        if: always() && needs.test.result != 'cancelled'
        uses: ./.github/workflows/job-test-report.yml
        permissions:
            actions: read
            pull-requests: write
