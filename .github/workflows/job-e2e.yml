---
name: e2e

on:
    workflow_call:
        secrets:
            HF_TOKEN:
                required: true

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            HF_TOKEN: ${{ secrets.HF_TOKEN }}
            HF_HUB_DISABLE_PROGRESS_BARS: '1'
            PYTHONWARNINGS: ignore
        steps:
            - uses: actions/checkout@v4

            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  version: latest
                  enable-cache: true
                  cache-dependency-glob: uv.lock

            - name: Set up Python
              run: uv python install

            - name: Install the project
              run: uv sync --all-extras --dev

            - name: Cache Hugging Face and pocket-tts models
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/huggingface
                      ~/.cache/pocket_tts
                  key: e2e-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
                  restore-keys: |
                      e2e-models-${{ runner.os }}-

            - name: Run fast e2e tests
              run: >
                  uv run pytest -m "e2e and not e2e_slow" -q --tb=short
                  --junitxml=e2e-results.xml

            - name: Upload e2e artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-report
                  path: e2e-results.xml
                  retention-days: 30
                  if-no-files-found: warn
