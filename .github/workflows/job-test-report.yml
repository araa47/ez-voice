---
name: test-report

on:
    workflow_call:

jobs:
    test-report:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pull-requests: write
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@v4
              with:
                  name: coverage-report
                  path: coverage

            - name: Download e2e artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: e2e-report
                  path: e2e

            - name: Generate test report comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      function coverageSection() {
                        const coveragePath = path.join('coverage', 'coverage.json');
                        if (!fs.existsSync(coveragePath)) {
                          return [
                            '### Coverage',
                            '',
                            '_Coverage artifact missing._',
                            '',
                          ];
                        }

                        const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                        const totals = coverage.totals;
                        const pct = totals.percent_covered.toFixed(1);

                        let badge = '🔴';
                        if (pct >= 80) badge = '🟢';
                        else if (pct >= 50) badge = '🟡';

                        let fileRows = '';
                        for (const [filePath, data] of Object.entries(coverage.files || {})) {
                          const filePct = data.summary.percent_covered.toFixed(1);
                          fileRows += `| \`${filePath}\` | ${filePct}% |\n`;
                        }

                        return [
                          `### ${badge} Coverage`,
                          '',
                          `| Metric | Value |`,
                          `|--------|-------|`,
                          `| **Total Coverage** | **${pct}%** |`,
                          `| Statements | ${totals.num_statements} |`,
                          `| Missing | ${totals.missing_lines} |`,
                          `| Excluded | ${totals.excluded_lines} |`,
                          '',
                          fileRows
                            ? '#### Per-file Coverage\n\n| File | Coverage |\n|------|----------|\n' + fileRows
                            : '_No source files covered._',
                          '',
                        ];
                      }

                      function e2eSection() {
                        const xmlPath = path.join('e2e', 'e2e-results.xml');
                        if (!fs.existsSync(xmlPath)) {
                          return [
                            '### E2E',
                            '',
                            '_E2E results not available yet (job may still be running or failed before writing results)._',
                            '',
                          ];
                        }

                        const xml = fs.readFileSync(xmlPath, 'utf8');
                        const suiteMatch = xml.match(/<testsuite\b([^>]*)>/);
                        const attrs = Object.fromEntries(
                          [...(suiteMatch?.[1].matchAll(/(\w+)="([^"]*)"/g) || [])].map(m => [m[1], m[2]])
                        );

                        const tests = Number(attrs.tests || 0);
                        const failures = Number(attrs.failures || 0);
                        const errors = Number(attrs.errors || 0);
                        const skipped = Number(attrs.skipped || 0);
                        const time = Number(attrs.time || 0).toFixed(1);
                        const passed = Math.max(0, tests - failures - errors - skipped);
                        const ok = failures === 0 && errors === 0 && tests > 0;
                        const badge = ok ? '🟢' : '🔴';

                        const cases = [];
                        for (const m of xml.matchAll(/<testcase\b([^>]*)>([\s\S]*?)<\/testcase>|<testcase\b([^/]*)\/>/g)) {
                          const caseAttrs = m[1] || m[3] || '';
                          const body = m[2] || '';
                          const name = (caseAttrs.match(/\bname="([^"]*)"/) || [])[1] || 'unknown';
                          const classname = (caseAttrs.match(/\bclassname="([^"]*)"/) || [])[1] || '';
                          const caseTime = (caseAttrs.match(/\btime="([^"]*)"/) || [])[1] || '0';
                          let status = '✅ pass';
                          if (/<failure\b/.test(body) || /<error\b/.test(body)) status = '❌ fail';
                          else if (/<skipped\b/.test(body)) status = '⏭️ skip';
                          const shortClass = classname.split('.').pop() || classname;
                          cases.push(`| \`${shortClass}::${name}\` | ${status} | ${Number(caseTime).toFixed(1)}s |`);
                        }

                        return [
                          `### ${badge} E2E`,
                          '',
                          `| Metric | Value |`,
                          `|--------|-------|`,
                          `| **Result** | **${ok ? 'passed' : 'failed'}** |`,
                          `| Passed | ${passed} |`,
                          `| Failed | ${failures + errors} |`,
                          `| Skipped | ${skipped} |`,
                          `| Duration | ${time}s |`,
                          '',
                          cases.length
                            ? '#### Tests\n\n| Test | Status | Time |\n|------|--------|------|\n' + cases.join('\n')
                            : '_No e2e testcases recorded._',
                          '',
                        ];
                      }

                      const body = [
                        '## Test Report',
                        '',
                        ...coverageSection(),
                        ...e2eSection(),
                        `> Report from commit ${context.sha.slice(0, 7)}`,
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existing = comments.find(c =>
                        c.user.type === 'Bot' && (
                          c.body.includes('## Test Report') ||
                          c.body.includes('## 🟢 Coverage Report') ||
                          c.body.includes('## 🟡 Coverage Report') ||
                          c.body.includes('## 🔴 Coverage Report') ||
                          c.body.includes('Coverage Report')
                        )
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
