---
name: test-report

on:
    workflow_call:

jobs:
    test-report:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pull-requests: write
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@v4
              with:
                  name: coverage-report
                  path: coverage

            - name: Download e2e artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: e2e-report
                  path: e2e

            - name: Generate test report comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');

                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const shortSha = context.sha.slice(0, 7);
                      const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;

                      async function jobLinks() {
                        const links = { run: runUrl };
                        try {
                          const { data } = await github.rest.actions.listJobsForWorkflowRun({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                            run_id: context.runId,
                            per_page: 50,
                          });
                          for (const job of data.jobs || []) {
                            const name = (job.name || '').toLowerCase();
                            if (name.includes('e2e') && !links.e2e) links.e2e = job.html_url;
                            else if (name.includes('test-report')) links.report = job.html_url;
                            else if ((name === 'test / test' || name.endsWith('/ test') || name === 'test') && !links.unit) {
                              links.unit = job.html_url;
                            } else if (name.includes('prek') && !links.prek) links.prek = job.html_url;
                            else if (name.includes('coverage') && !name.includes('test-report') && !links.unit) {
                              links.unit = job.html_url;
                            }
                          }
                        } catch (err) {
                          core.warning(`Could not list workflow jobs: ${err.message}`);
                        }
                        return links;
                      }

                      function coverageSection(links) {
                        const coveragePath = path.join('coverage', 'coverage.json');
                        if (!fs.existsSync(coveragePath)) {
                          return [
                            '### Coverage',
                            '',
                            '_Coverage artifact missing._',
                            '',
                          ];
                        }

                        const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                        const totals = coverage.totals;
                        const pct = totals.percent_covered.toFixed(1);

                        let badge = '🔴';
                        if (pct >= 80) badge = '🟢';
                        else if (pct >= 50) badge = '🟡';

                        let fileRows = '';
                        for (const [filePath, data] of Object.entries(coverage.files || {})) {
                          const filePct = data.summary.percent_covered.toFixed(1);
                          fileRows += `| \`${filePath}\` | ${filePct}% |\n`;
                        }

                        const unitLink = links.unit
                          ? ` · [unit job](${links.unit})`
                          : '';

                        return [
                          `### ${badge} Coverage${unitLink}`,
                          '',
                          `| Metric | Value |`,
                          `|--------|-------|`,
                          `| **Total Coverage** | **${pct}%** |`,
                          `| Statements | ${totals.num_statements} |`,
                          `| Missing | ${totals.missing_lines} |`,
                          `| Excluded | ${totals.excluded_lines} |`,
                          '',
                          fileRows
                            ? '#### Per-file Coverage\n\n| File | Coverage |\n|------|----------|\n' + fileRows
                            : '_No source files covered._',
                          '',
                        ];
                      }

                      function statusEmoji(outcome) {
                        if (outcome === 'passed') return '✅';
                        if (outcome === 'failed') return '❌';
                        if (outcome === 'skipped') return '⏭️';
                        return '❔';
                      }

                      function e2eSection(links) {
                        const summaryPath = path.join('e2e', 'e2e-summary.json');
                        const xmlPath = path.join('e2e', 'e2e-results.xml');
                        const e2eLink = links.e2e ? ` · [e2e job](${links.e2e})` : '';

                        let scenarios = [];
                        if (fs.existsSync(summaryPath)) {
                          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                          scenarios = summary.scenarios || [];
                        } else if (fs.existsSync(xmlPath)) {
                          // Fallback: parse junit only
                          const xml = fs.readFileSync(xmlPath, 'utf8');
                          for (const m of xml.matchAll(/<testcase\b([^>]*)>([\s\S]*?)<\/testcase>|<testcase\b([^/]*)\/>/g)) {
                            const caseAttrs = m[1] || m[3] || '';
                            const body = m[2] || '';
                            const name = (caseAttrs.match(/\bname="([^"]*)"/) || [])[1] || 'unknown';
                            const classname = (caseAttrs.match(/\bclassname="([^"]*)"/) || [])[1] || '';
                            const caseTime = (caseAttrs.match(/\btime="([^"]*)"/) || [])[1] || '0';
                            let outcome = 'passed';
                            if (/<failure\b/.test(body) || /<error\b/.test(body)) outcome = 'failed';
                            else if (/<skipped\b/.test(body)) outcome = 'skipped';
                            const shortClass = classname.split('.').pop() || classname;
                            scenarios.push({
                              key: `${shortClass}::${name}`,
                              title: `${shortClass}::${name}`,
                              covers: '',
                              stack: '',
                              outcome,
                              duration: Number(caseTime),
                            });
                          }
                        } else {
                          return [
                            `### E2E${e2eLink}`,
                            '',
                            '_E2E results not available (job may have failed before writing results)._',
                            '',
                          ];
                        }

                        const passed = scenarios.filter(s => s.outcome === 'passed').length;
                        const failed = scenarios.filter(s => s.outcome === 'failed').length;
                        const skipped = scenarios.filter(s => s.outcome === 'skipped').length;
                        const time = scenarios.reduce((acc, s) => acc + Number(s.duration || 0), 0).toFixed(1);
                        const ok = failed === 0 && scenarios.length > 0;
                        const badge = ok ? '🟢' : '🔴';

                        const rows = scenarios.map(s => {
                          const title = s.title || s.key;
                          const stack = s.stack ? `<br><sub>${s.stack}</sub>` : '';
                          const covers = (s.covers || '').replace(/\n/g, ' ');
                          return `| ${statusEmoji(s.outcome)} **${title}**${stack} | ${covers} | ${Number(s.duration || 0).toFixed(1)}s |`;
                        });

                        return [
                          `### ${badge} E2E${e2eLink}`,
                          '',
                          `| Metric | Value |`,
                          `|--------|-------|`,
                          `| **Result** | **${ok ? 'passed' : 'failed'}** |`,
                          `| Passed | ${passed} |`,
                          `| Failed | ${failed} |`,
                          `| Skipped | ${skipped} |`,
                          `| Duration | ${time}s |`,
                          '',
                          '#### What was tested',
                          '',
                          '| Scenario | Details | Time |',
                          '|----------|---------|------|',
                          ...rows,
                          '',
                        ];
                      }

                      const links = await jobLinks();
                      const linkLine = [
                        `[Workflow run](${links.run})`,
                        links.prek ? `[prek](${links.prek})` : null,
                        links.unit ? `[unit](${links.unit})` : null,
                        links.e2e ? `[e2e](${links.e2e})` : null,
                      ].filter(Boolean).join(' · ');

                      const body = [
                        '## Test Report',
                        '',
                        linkLine,
                        '',
                        ...coverageSection(links),
                        ...e2eSection(links),
                        `> Report from commit [\`${shortSha}\`](${commitUrl})`,
                      ].join('\n');

                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const existing = comments.find(c =>
                        c.user.type === 'Bot' && (
                          c.body.includes('## Test Report') ||
                          c.body.includes('Coverage Report')
                        )
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }
